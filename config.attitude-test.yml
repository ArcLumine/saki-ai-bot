# 仅用于身份差异测试，由 test/attitude.js 通过 QQBOT_CONFIG 加载。
onebot:
  mode: forward
  url: ws://127.0.0.1:39801
  accessToken: "att-token"
  reconnectInterval: 300

llm:
  baseURL: http://127.0.0.1:39802/v1
  apiKey: "sk-test-fake-key"
  model: test-model
  temperature: 0
  maxTokens: 200
  timeout: 10000
  systemPrompt: |
    你是客服小祥。

trigger:
  privateChat: true
  groupChat: true
  allowGroups:
    - "200000001"
  requireAtInGroup: true
  # ⚠️ 2026-10-04 加：私聊白名单。
  #    原来这里没配 `allowPrivateUsers` ⇒ `privateAllowed()` 一律 false
  #    ⇒ 第 [5] 步那条私聊消息**压根没进 LLM**，`probeOf('在吗，问个事')` 永远是 undefined，
  #    那条断言**长期是假失败**（基线上就红着，一直被当成噪音）。
  #    ⚠️ 名单里同时放 OWNER 和 MEMBER，好让「主人私聊」和「陌生人私聊」两档都能验到。
  allowPrivateUsers:
    - "10000001"
    - "30003"
  keywords: []
  historyRounds: 2
  cooldownMs: 0
  maxInputChars: 1000

status:
  enable: false
  host: ""
  keywords: []

teach:
  enable: false
  teachers: []
  keywords: []

faces:
  collect: false

chat:
  # ⚠️ 2026-09-23 加：**把「判断节流」关掉** —— 套件里相邻的 say() 只隔 1~2 秒，
  #    而节流默认 5 秒 ⇒ 有那么一条会被「5s 内刚问过」吞掉 ⇒ 她压根没回 ⇒ 断言超时。
  #    套件不是在测节流，不该受它摆布。⚠️ 不能填 0（代码是 Number(x) || 5000）。
  judgeThrottleMs: 1
  enable: false

chunking:
  maxChars: 60
  delayMs: 50
  firstFlushChars: 20

ownerQQ: "10000001"
logLevel: info

# 测试专用：独立端口，避免多个测试抢 3099
webui:
  enable: false
  port: 3106

search:
  merged: true

# ⚠️ 测试里关掉在线时长跟踪 —— 它会自己独立查服务器，
#    会污染「查询次数」类断言（真实踩过）
sessions:
  enable: false
