chunking:
  maxChars: 60
  # 分条之间等多久（毫秒）。⚠️ 2026-09-21 起可以给**区间**：
  #   每条间隔在 `delayMs` ~ `delayMaxMs` 之间**各自独立随机**
  #   （用户要求：「用随机数，范围 1 秒到 2 秒，这样更像真人在发消息」）。
  #   ⚠️ 不写 `delayMaxMs` 就是**不随机**（固定 `delayMs`）—— 保持老手感。
  delayMs: 650
  # delayMaxMs: 2000
  firstFlushChars: 25
webui:
  enable: true
  host: 127.0.0.1
  port: 3099
# 复读机（2026-09-17 加）：群里一堆人刷同一句话时，她也跟一句 **+1**。
#   ⚠️ 第 3 句起才可能跟（前两句只是"两个人说了同一句"）；
#      `probabilities` 对应第 3 / 4 / 5 / 6+ 句的概率，**依次减小**（用户要求：第三句最大）；
#      有人插一句别的 → 链立刻断（计数回 1）→ 不会"被打断了还在接"；
#      同一条链**只接一次**（不然就成了她一个人 +1 个没完）。
repeat:
  enable: true
  probabilities: [0.6, 0.4, 0.25, 0.15]
  cooldownMs: 300000
faces:
  collect: true
  # 每几条回复才允许插一张表情包（**调小 = 发得更勤**）。
  # ⚠️ 这是**代码层硬闸** —— 提示词里就算写了频率，模型也偏爱发表情，所以必须兜一道。
  sendEvery: 6
chat:
  # 生成回复期间，**同一个人**又发消息 → 最多"丢掉草稿重来"几次（2026-09-21 加）。
  #   他 @ 她一下、紧接着又补一句，原来是**回两条**（各带一个引用框，像没在听人说话）；
  #   现在改成"他还在说 → 丢掉这一版、带着新消息重新生成" → 群里只出一条。
  #   ⚠️ `0` = 关掉（退回老样子：这一轮发完再处理攒下的那批，也就是回两条）；
  #   ⚠️ 只有**同一个人**连发才打断生成，别人插话不动这一轮（那是另一件事）；
  #   ⚠️ 留上限是防"有人一直刷、她永远不说话"。
  requeueMax: 2
  enable: true
  group: '200000001'
  question:
    enable: true
    keywords:
      - 服务器
      - 崩了
      - 卡
      - 模组
      - 存档
      - 怎么进
      - mtr
      - 整合包
      - java
      - 进不去
      - 报错
      - 白名单
      - 建设
      - 申请
      - op
      - 管理员
      - 在线
    probability: 0.35
    cooldownMs: 180000
    requireQuestionMark: true
    minChars: 5
  mention:
    enable: true
    names:
      - 小祥
      - 祥子
      - 客服小祥
      - 大祥
      - 大祥老师
      - 祥老师
      - 祥子老师
      - 祥宝
      - 丰川祥子
      - 丰川
      - saki
      - sakiko
      - togawa
      - zyhg
      - oblivionis
      - オブリビオニス
      - 章鱼小祥
      - 章鱼祥
      - 白祥
      - 黑祥
      - 骆驼祥子
      - 小祥酱
      - 祥子酱
      - saki酱
    probability: 0.4
    cooldownMs: 300000
    minChars: 2
  # ⚠️ 单人频率闸（2026-10-02）：治「一个人反复触发、把 token 烧光」。
  #    冷却是**按群**算的，一个人连发时每条都算"冷却已过" ⇒ 每次都烧一次模型调用。
  #    · 超过 softLimit：她开始自己收着（这个数会喂给说话判断，**密度仍由判断管**）
  #    · 达到 hardLimit：**在问模型之前**直接静默 ⇒ 一次调用都不花
  #    ⚠️ hardLimit 会连真问题一起静默（用户明确要求「问题类也不豁免」——
  #       换个问法绕不过豁免，只能按人头压）。嫌误伤就调大它，不用改代码。
  #    ⚠️ 只在内存里计数，**不落盘**（和「主动接话冷却」一样的取舍）。
  #    ⚠️ 三个数在 WebUI「活跃度 → 单人频率闸」里可改。
  perUser:
    enable: true
    windowMs: 300000
    softLimit: 3
    hardLimit: 6
  # ⚠️⚠️ **召唤频率闸**（2026-10-03）—— 治「一个人换着花样点名刷屏」。
  #    · 为什么必须单独一套：上面那个闸**根本覆盖不到召唤**。
  #      @她 / 引用 / 正文点名 / 戳 / 关键词 / 服务器问题这六种在 `shouldJoinChat`
  #      **之外**就提前返回了 ⇒ 既不过闸也**从不记账** ⇒ 一直打名字就能无限触发。
  #      （这是比刷闲聊更省事的滥用方式：刷闲聊至少要过 judge。）
  #    · 为什么不用内容去重：换着花样（「小祥在吗 / 叫一下祥子 / 小祥?」）
  #      哈希各不相同，挡不住 —— 只能按人头压。
  #    · 撞线后**只回一句提示**，之后全静默（每次都回的话提示本身就是新刷屏源）。
  #    · 和 perUser 是**完全独立的两套计数**：聊天不偷召唤额度，反之亦然。
  #    · ⚠️ 没有软阈值：召唤是「要么答要么静默」的二元决策，没有中间态。
  #    · ⚠️ 阈值**故意设得很高**（2 分钟 10 次）—— 召唤是"真在问她"，
  #      误伤比多花一次调用更伤。嫌刷屏就调低，不用改代码。
  #    ⚠️ 只在内存里计数，不落盘。WebUI「活跃度 → 召唤频率闸」里可改。
  perUserCall:
    enable: false
    windowMs: 120000
    limit: 10
  followUp:
    enable: true
    idleMs: 25000
    # ⚠️ **同一个人**接着跟你说时的窗口（比 idleMs 长）—— 2026-09-15 实测：
    #    85 秒后他接的那句「那最近mc圈有什么炸裂的视频」被窗口挡掉了，她没接。
    #    这明明就是在跟她说话，所以单独给一个宽窗口（仍然要过判断，不是必接）。
    sameUserMs: 180000
    probability: 1
    maxChain: 2
    minChars: 2
  strictness: 30
  ackAfterMs: 30000
  # 活跃群里同时最多允许几条"主动接话"排队/生成（多出来的直接放弃，避免越答越旧）
  maxVoluntaryQueue: 1
  # 主动接话轮到自己、真要发送前，如果已经被刷下去这么多条消息就放弃不发
  voluntaryStaleAfter: 8
