  # ⚠️ 只看**条数**、不要求"人多" —— 实际群里常常是**一个人特别起劲**连着接话。
  warmCount: 4
  warmExtraStages: 3
  warmWaitMs: 600000
ownerQQ: '<主人的 QQ>'
# 主人的各种叫法（**识别用**：别人这么喊他时，用来认出"这是不是在说他"）。
# ⚠️ 这些**不代表她要跟着这么叫** —— 她该怎么叫，在人设页「她怎么称呼别人 → 平时怎么叫主人」那栏。
ownerAliases:
  - '<别人怎么叫他，例：粥粥、舟老师>'
botQQ: '<机器人的 QQ>'
# ── QQ 协议端（OneBot 实现）────────────────────────────────
# ⚠️ 「收消息/发消息」跟协议端无关（换谁都是 ws + token），所以换协议端**只需要改这里**；
#    但"出二维码 / 重启协议端 / 查登录状态"这些**管理能力各家不一样**，不支持时界面会明说。
#
#   name: snowluma  → **默认**。独立协议实现（不注入 QQ 客户端、不依赖快登凭据），
#                     管理面在它自己的 WebUI（默认 http://127.0.0.1）。
#                     ⚠️ 它的许可是「源码可见·非商业」：不得商用；公开发布修改版/衍生版
#                        要事先书面授权 ⇒ 本项目的安装包**不打包它、也不自动部署它**。
#   name: napcat    → 有自己的 WebUI + 接口，机器人能代你出码/重启（⚠️ 它的许可**禁止商用**）
#   name: llonebot  → LLBot 是独立应用：登录/扫码/重连在它自己的 WebUI/GUI 里做
#                     （GPL-2.0：可商用，但**分发**它时必须一并提供源码）
#   name: onebot    → 任何通用 OneBot 11 实现：只保证收发，管理面请用它自己的方式
provider:
  name: snowluma
  # 下面三项**可以留空**：napcat 用 ../napcat/NapCat.Shell + launcher-win10-user.bat；
  # snowluma 用 C:\SnowLuma + _start-hidden.vbs（装在哪就写哪）
  dir: '' # 协议端目录（启动/守护脚本要用）
  launcher: '' # 启动脚本/可执行（相对 dir 或绝对路径）
  manageUrl: '' # 它自己的管理界面地址（只用于在机器人界面上给你一个链接）
logLevel: info
qzone:
  enable: true
  auto: true
  ugcRight: 1
  maxPerDay: 6
  cooldownMs: 7200000
  checkIntervalMs: 1800000
  windowMs: 43200000
  minMaterial: 14
  maxMaterialAgeMs: 3600000
vision:
  enable: true
  # 留空时自动使用 llm.model；请确认该模型支持图片输入
  model: ''
  describeStickers: true
  maxBytes: 20971520
machine:
  enable: true
  name: ''
saucenao:
  enable: true
  apiKey: <另一个服务的 Key（如果用到）>
  results: 5
  minSimilarity: 60
observe:
  enable: true
  # 攒够多少条消息就总结一次群记忆
  threshold: 120
  # ⚠️ 时间兜底：这一群里最老的一条超过这么久，**哪怕只有几条也总结**。
  #    没有它的话，消息少的群永远攒不到 threshold，群记忆就一直不更新。
  maxAgeMs: 21600000
  checkIntervalMs: 30000
  idleIntervalMs: 1800000
  keepPeople: 60
  # 大事这节最多留几条（和压缩提示词里写的「15 条以内」对齐）
  keepEvents: 15
  compress:
    enable: true
    checkIntervalMs: 43200000
    # 多久允许压缩一次群记忆（毫秒）。压缩时会：**大事按时间压成小结**、
    # **「群友」那节只许细化合并、一条都不许删**。
    minIntervalMs: 43200000
affinity:
  enable: true
  # 到多少算「可以加好友了」——群里 @ 他、让他来加好友。
  friendThreshold: 90
  # ─────────────────────────────────────────────────────────────
  # 群里「对他放宽一档」的门槛（2026-09-30 用户要求）。
  # ⚠️ 与上面 friendThreshold 是**两件独立的事，故意不对齐**：
  #    用户原话「群聊还是大于 70 解锁但是大于 90 才能加好友」。
  #    70 分只是"常客级"（单次 +3、每天 +8，得持续互动一阵子）；
  #    90 那条是"已经是自己人"，所以权限线压在好友线之下。
  #    刷到 70 的人：群里可以跟他放松说话（撒娇那一档）。
  # sensitiveUnlock: 70
  # 掉到多少才**收回**那档（滞回）——必须比上面那个小。
  # 留这个间隔是为了不闪：只有 unlock 的话，70→69 会立刻关、再涨回 70 又开。
  # ⚠️ 填成 ≥ sensitiveUnlock 的话那档会"只开不关"，系统会帮你夹住。
  # sensitiveRetract: 60

# ── 海豹骰（SealDice）────────────────────────────────────
# ⚠️ 这里配的是**小祥主动去问海豹**（小祥算骰、报结果），**不是**海豹接 QQ。
#    因为小祥和海豹若都连同一个 NapCat，会有「自反馈死循环」
#    （小祥发的消息被海豹当群友消息，再转回给小祥）。详见 src/sealdice.js 顶部。
# ⚠️ baseUrl / token 不填 ⇒ 完全不启用，对现有行为零影响。
sealdice:
  enable: true
  # 海豹自己的 WebUI 地址（启动 sealdice-core.exe 后默认 3211）。
  # ⚠️ API 前缀是 /sd-api，模块里已经拼好了，这里只写到端口。
  baseUrl: http://127.0.0.1:3211
  # 海豹 WebUI → 账号设置 → 访问令牌（存在它的 data/dice.yaml 的 accessTokens 里）。
  # ⚠️ 这是**本机密钥**：token 不进公开仓库，真实 config.yml 也不进。
  token: ''
  # 单次 API 调用超时（毫秒）。这条调用在消息处理链路上，挂住 = 消息卡住。
  timeoutMs: 4000

# ── 骰娘模式 ────────────────────────────────────────────
# ⚠️ 与上面的 `quiet`（安静指令）是**两件不同的事**：
#   · quiet    = 什么都不说（连骰点也不答）
#   · diceMode = **只说骰点**，别的全程静默
# 混在一起会出现「以为安静了、结果骰点还在回」这种查起来很懵的情况。
diceMode:
  enable: true
  # ⚠️ 必须**整句相等**，不是关键词匹配 ——
  #    「今天散场了吧」这种闲聊不该触发（误进骰娘模式比误判安静更糟）。
  enterKeys:
    - 骰娘
    - 当骰娘
  exitKeys:
    - 散场
    - 收摊
  # 超时自动退出（毫秒）。0 = **永不自动退**，只能靠退出词解除。
  # ⚠️ 上限 7 天（config.js 会夹）—— 忘了退会导致她长时间不说话。
  durationMs: 0
  # 明确**不**当成骰点指令的句子（海豹的命令很多，不穷举，默认都算）。
  skipDiceKeys: []

# ── 跑团记录（海豹 log → 章节）──────────────────────────
# ⚠️ 与 observe/、storyline/ **并列的第三个分支**（不塞进那两处）：
#   · observe    =「这个人什么样」  · storyline =「她自己经历过什么」
#   · 跑团记录   =「这一局发生了什么」（谁掷了什么骰、检定结果、剧情到哪）
# 混进 observe 的话，观察总结会把剧情当成"群友性格"，越跑越歪而且看不出来。
diceLog:
  # ⚠️⚠️ **默认关闭**（用户 2026-09-30：「先写出来但是不启用，我后面再改」）。
  #    要用就把这里改成 true，并填下面的 groups。
  enable: false
  # ⚠️ 不填就**不会去拉 log** —— 我们不知道哪些群在跑团，硬拉是白花钱。
  #    一行一个群号。海豹那边是「群 → 局 → 消息」三层，按群号只读最近那一局。
  groups: []
  # 两次拉取的最小间隔（毫秒）—— 别每条消息都去问海豹要 log
  minIntervalMs: 300000
  # 拉取定时器间隔（毫秒）
  pullIntervalMs: 300000
  # 每次拉多少条
  pageSize: 50
  compress:
    # 少于这么多条不压（压一次纯属浪费，而且模型会想动刚发生的事）
    minEntries: 8
    # 两次压缩的最小间隔（毫秒）
    minIntervalMs: 1800000
    # 多久问一次「该压了吗」（毫秒）
    checkIntervalMs: 600000
friend:
  enable: true
  # ⚠️⚠️ 文案必须说清**谁加谁**（2026-09-18 修）：
  #    协议层**发不了**加好友申请（NapCat 没有那个 action），所以只能
  #    **对方来加机器人**，机器人收到申请后自动通过（`set_friend_add_request`）。
  #    原来那句「同意之后有几率主动发消息过来」没说清动作，群友会卡在"谁加谁"上。
  notice: '@{at} 我这边没法主动加人，你来加我吧（点头像→加好友）'
  dailyChance: 0.35
  dayFromHour: 9
  dayToHour: 22
  minGapMs: 72000000
  checkIntervalMs: 600000
poke:
  enable: true
  # 文字回应的防刷屏：同一个人这么多毫秒内**只回一次话**（2026-09-16 起她戳了她会看着上下文回一句）。
  #   ⚠️ 它只管"回话"；下面那个计数**不受它影响**。
  cooldownMs: 30000
  # 拍回去（`send_poke`）：同一个人的戳攒次数，每这么多下回拍一次（拍完归零 = 第 3、6、9… 次）。
  #   ⚠️ 用户 2026-09-21 定的：「机器人戳回来的话在我戳了3次再触发一次就行了」。
  #   设 1 = 每戳必拍；设很大的数 = 基本不拍。
  countPerBack: 3
  # 能不能发 `send_poke` 由协议端决定（2026-09-21）：
  #   · snowluma（默认）：能发 —— 独立协议实现，`send_poke` 是它自己的 action ⇒ 默认就拍
  #   · napcat：默认**不发** —— 它走 PacketBackend，QQ 版本越界必然失败，而每次失败
  #             都是一次异常请求（风控靠这个判定外挂，用户收到过处罚通知）
  #   ⚠️ 这里写 true/false 就**覆盖**上面的默认；**不写**才是"按协议端"。
  # tryPacket: true
flood:
  enable: true
  windowMs: 10000
  count: 6
  muteMs: 60000
# ── 群内「安静」指令（2026-09-28）─────────────────────────────────
#    主人/管理员一句话让她闭嘴，直到有人说解除词。
#    跟上面的 flood（刷屏闭麦）**不是一回事**：那个是自动惩罚、只针对一个人；
#    这个是手动下令、针对整个群 —— 她不说话不等于"哪个人刷屏了"。
quiet:
  enable: true
  # ⚠️ 判据是**整句相等**（只忽略句末标点），不是"包含" ——
  #    「小祥安静点，她今天话好多」这种半句话不算，否则她说一句就被自己闭嘴一次。
  keywords:
    - 小祥安静
  # ⚠️ 解除词**先判**（见 src/bot.js 的 matchQuiet）
  releaseKeywords:
    - 小祥说话
  # 0 = 一直安静到有人说解除（重启后仍然记得）
  durationMs: 0
  # 只在这个群生效；留空 = 哪个群都认
  groupId: '<跑团群>'
search:
  merged: true
  mergedTimeoutMs: 45000
  engines:
    bing: true
    ddg: true
    google: true
    bilibili: true
    moegirl: true
bilibili:
  enable: true
  ownerUid: '30000001'
  cacheMs: 1800000
  timeoutMs: 15000
  limit: 10
speakJudge:
  enable: true
attribution:
  enable: true
  minChars: 12
  timeoutMs: 8000
solve:
  enable: true
  maxTokens: 24000
sessions:
  checkIntervalMs: 30000
  idleIntervalMs: 180000
mute:
  enable: true
  seconds: 60
  cooldownMs: 300000
balance:
  enable: true
  checkIntervalMs: 1800000
  low: 5
  critical: 2
monthlyReport:
  enable: true
  hour: 21
  checkIntervalMs: 1200000
  minIntervalMs: 86400000
  qzone: true
selfFollowUp:
  enable: true
  probability: 0.35
  maxPerReply: 5
  continueProbability: 0.5
  betweenMs:
    - 400
    - 1200
tic:
  enable: true
  windowMs: 7200000
  repeatLimit: 3
  # 口癖已移进人设包：身份与话术 → 口癖 → 句首口癖 / 句末口癖。
  # 这里是通用节流参数，不再维护角色专属的 words 词表。
# 「她吃了没」状态机（2026-09-17 加）。
# 她在剧情里、在群里说过的「我去吃饭了」会记成**有寿命的状态**，
# 过了 minutes 分钟自动算"吃完了" —— 之后有人喊她一起吃饭，她自己就知道吃过没有，
# 不会再答应第二顿（用户原话：「下次有人喊她，他自己就知道吃过没有了」）。
meal:
  enable: true
  # 「在吃」这个状态活多久（分钟）。用户拍板：10 分钟。
  minutes: 10
  # ⚠️ 关键词可以不填（用 src/meal.js 里的默认表）；要覆盖就写全，别只写一半。
  #    eating: [去吃饭, 吃饭去, 先去吃, 吃个饭, 去食堂, 下楼吃, 出去吃, 去吃了, 干饭, 吃饭了, 先吃饭]
  #    done:   [吃完了, 吃过了, 刚吃完, 吃好了, 吃饱了, 吃完回来, 吃过饭了, 吃完啦]
  #    none:   [不吃了, 还没吃, 没吃饭, 不饿, 不想吃]
# ⏰ **定时提醒**（2026-09-18 加，用户要求）。
# 他说「明天早上八点提醒我交作业」→ 她**当场应一声**，到点**真的 @ 他**、
# 并**用她自己的话**把那件事说一遍；说「提醒我**和某某**」时，会先在这个群里
# 找那个人 —— 找到了就**一起 @**，**找不到就如实说没找到**（绝不乱 @ 一个）。
# ⚠️ 只在**他说那句话的地方**提醒：群里定的发群里，私聊定的发私聊。
# ⚠️ 提醒会落盘（state/remind.json）—— 重启、掉线都不会忘。
remind:
  enable: true
  # 多久查一次有没有到点（毫秒）。默认 60 秒（提醒的最小粒度就是分钟）。
  checkIntervalMs: 60000
  # 让她用自己的话提醒（过一次模型，15~40 字，只改说法不改内容）。
  # ⚠️ 设成 false = 省掉这次调用，直接用「到点了，你不是说要××吗」这句模板；
  #    模型超时/不可用时也会**自动**退回这句 —— 提醒不会因此消失。
  rewrite: true
  # 最多同时挂多少条（防被刷爆）
  maxItems: 50
  # 发不出去时一直重试多久（毫秒）才认输。默认 2 小时。
  # ⚠️ 别调太小：这个号每几小时掉一次线，掉线期间正好到点的提醒就靠这段时间补发。
  giveUpMs: 7200000
  # 最远能定到多久以后（天）。默认 7 天，超了就当场告诉她"太远了"。
  maxAheadDays: 7
groupParams: {}
