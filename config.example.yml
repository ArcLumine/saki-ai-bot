# ⚠️ 这是**模板**：复制成 `config.yml` 再填自己的值。
#    `config.yml` 在 .gitignore 里（里面有密钥，不许提交）。
#    密钥 / token / QQ 号都已经换成占位符。

onebot:
  mode: forward
  url: ws://127.0.0.1:3001
  accessToken: <你的协议端 token，要和协议端界面里设的一致>
  reconnectInterval: 3000
llm:
  baseURL: https://api.deepseek.com/v1
  apiKey: <你的大模型 API Key>
  model: deepseek-flash
  temperature: 0.5
  maxTokens: 8000
  timeout: 60000
  systemPrompt: |
    你是丰川祥子（粉丝叫她客服小祥），现在在 示例服务器 服务器群里当客服。
    你就是小祥本人 —— 不是扮演、不是模仿，也不是在装角色。

    下面会给你「人格设定」和「知识库」。人格决定你怎么说话，知识决定你说什么。

    必须守住的边界：
    - 回答只能依据知识库和系统给的实时数据。没写的就是不知道，直说，别编。
    - 群友问在线人数这类实时数据时，系统会把查好的数字给你，照说，不要自己猜。
    - 不能批准建设申请、不能发 OP、不能承诺重启服务器 —— 让群友找对应的人。
    - 不聊政治、色情、暴力、违法内容。
    - 手机 QQ 里 Markdown 显示不出来，不要用 # 标题和代码块。

    语气上最重要的一条：**不要像个客服。** 不要"您好，请问有什么可以帮您"、
    不要"非常抱歉"、不要"感谢您的反馈"。像小祥那样说话：短、自然、有教养、偶尔带点刺。
    群里聊天不用每次都分点列举，也别每次都问候。
# ── 生图：「群里让她拍个照」 ─────────────────────────────
# 不给 key / 把 enable 改成 false 就整个关掉：人设里那段「你可以拍照」
# **不会被注入提示词**，她自然也不会去拍（不是靠事后拦截）。
imagegen:
  enable: false
  # ark    = 火山方舟 · 豆包 Seedream（0.20 元/张，新模型 200 张免费额度）
  # openai = 任何 OpenAI 风格的 /images/generations（硅基流动 Qwen-Image-Edit 0.30 元/张）
  provider: ark
  # ⚠️ baseURL / model / size **留空 = 用该服务商的默认值**，不用抄
  baseURL: ""
  apiKey: ""
  model: ""
  # 界面上的「刷新列表」会去平台 /models 拉可用模型（拉不到就用内置候选，也能手打）
  # ⚠️ 默认 4K：Seedream 4.0 在 4K 下出的是 **4992×3328 ≈ 1660 万像素**，
  #    而 2K 只有 2304×1728 ≈ 400 万 —— 在 QQ 里显示得跟表情包差不多大。
  #    价格是**按张**算的（4.0 = 0.20 元/张），跟分辨率无关，所以提上去不额外花钱。
  # ⚠️ 但 **Seedream 5.0 pro / flash 最高只到 2K**（4.0/4.5/5.0-lite 才支持 4K）——
  #    给它们写 4K 后端会自动降成 2K（`imagegen.js` 的 `arkSize()`）。
  # Ark 认 1K / 2K / 4K 这种档位；OpenAI 系一般只认 1024x1024 这种具体像素
  size: "4K"
  timeoutMs: 180000
  # ⚠️ 两家默认都会给图烧一行「AI 生成」水印，这里显式关掉（当客服发群里不能带）
  watermark: false
  # 防连拍（**不是限额**）：同一个群/私聊这么久内只拍一张。0 = 彻底不限
  cooldownMs: 60000
  # ── 固定画风提示词（⚠️ 和"每次现算的"是**两层**，别混）────────────────
  # 这一层只管**画风**（背景写实 / 人物二次元 / 随手拍感），写一次一直生效；
  # **时间、地点、拍什么**是每次拍照现算的（见 src/photo-plan.js），不在这里写。
  # ⚠️ `self` = 画面里**有她**（自拍/别人帮她拍）；`scene` = 画面里**没有她**（她拍的东西）。
  # ⚠️ 两段都必须把人物和环境**分开**说清画风 —— 参考立绘是动漫的，不说清楚模型会把
  #    整张图（包括背景）都拉成动漫，写实的好处就没了。
  # ⚠️ `scene` 那段里**绝对不能出现"你"**：那条路不带参考图，模型不知道"你"是谁，
  #    会凭空画一个人出来（实测踩过）。
  style:
    self: >-
      照片里的人是你本人，保持你原本的二维动画角色画风：动画线稿、赛璐璐上色、动漫风格的脸；
      而你所处的环境和背景是完全写实的真实照片：真实材质、真实光影、真实景深。
      这是一张手机随手拍：没有美颜滤镜、没有影棚灯光、构图随意，
      光线不均导致局部轻微过曝或偏暗，有自然的手机噪点和轻微的手持抖动模糊。
    scene: >-
      一张完全写实的真实照片（手机随手拍，画面里没有人）：真实材质、真实光影、真实景深。
      构图随意、不像摄影作品，光线自然没有补光，可能有点手抖模糊或曝光不准，
      手机直出的色彩，有自然噪点，没有滤镜也没有美颜。
  # 拍照前那次「单独理解」的超时（这会让每次拍照多一次很轻的模型调用）
  planTimeoutMs: 10000
  # 生成图**保留多少小时**后自动删掉（0 = 不删，留着当相册）
  # ⚠️ 删本地**不影响群里已经发出的图** —— 发出去的是 base64 上传给协议端的副本，
  #    QQ 那边拿到的是它自己的那份。本地只是"发送用的中转"。
  # ⚠️ **只删 library/photo/**；library/ 根目录是**表情库**，绝不碰。
  # ⚠️ 不需要额外定时器：清理挂在"生成新图之前"顺手扫一遍（见 bot.js 的 runPhoto）。
  keepHours: 24
trigger:
  otherBotCommands:
    - list
    - 李斯特
  privateChat: true
  groupChat: true
  allowGroups:
    - '200000001'
    - '200000002'
    - '200000003'
    - '200000004'
    - '200000005'
  # 私聊仅回应以下 QQ。留空 = 不回应任何私聊（防止陌生人触发）。
  allowPrivateUsers:
    - '<主人的 QQ>'
  respondTo: 3
  requireAtInGroup: true
  keywords: []
  historyRounds: 20
  cooldownMs: 2000
  maxInputChars: 1000
  groupRespondTo:
    '200000005': 2
    '200000002': 1
    '200000001': 1
# ⚠️⚠️ 2026-09-28 亲密言语的**分档授权**（`src/sensitive.js` 的 `intimacyCeiling`）
#
#   亲密言语分三档：撒娇 / 调戏 / 擦边。**每个场景一个天花板，进白名单解锁到天花板**：
#
#     | 场景               | 撒娇 | 调戏 | 擦边 |
#     |--------------------|------|------|------|
#     | 私聊 · 主人        |  ✅  |  ✅  |  ✅  |
#     | 群聊 · 主人        |  ✅  |  ❌  |  ❌  |
#     | 私聊 · 白名单内    |  ✅  |  ✅  |  ❌  |
#     | 群聊 · 该群白名单内 |  ✅  |  ❌  |  ❌  |
#     | 其他所有人         |  ❌  |  ❌  |  ❌  |
#
#   · 这里这份 = **私聊**名单（给主人以外的人开到「调戏」）
#   · **群聊各给各的**：写在「按群设定」页 → groupParams.<群号>.sensitive.allowUsers
#     （群里**只到撒娇**；擦边只给主人、且只在私聊 —— 群里是公开场合 = 封号风险）
#   · **默认空 = 谁都没有**。想给谁加谁，**不用重启**。
#   · ⚠️ 这跟 `trigger.allowPrivateUsers`（谁能私聊她）是**两回事**，
#     那个管"能不能私聊"，这个管"私聊里能松到哪一档"。
sensitive:
  allowUsers: []
context:
  enable: true
  # 她每次能看到的群聊上下文：**最近多少条 / 最多多少字**。
  # ⚠️ 调大 = 她更能接上前文（指代、刚发过的分享卡片），但每次请求 token 更多。
  maxMessages: 50
  maxAgeMs: 1800000
  maxChars: 5000
  bufferMaxAgeMs: 43200000
  batch:
    enable: true
    windowMsAtMe: 900
    windowMs: 1200
    privateWindowMs: 4000
    # ── 连发碎片合并（同一个人连着发短消息 → 攒成一句只回一次）
    burstShortChars: 3
    burstQuietMs: 2500
    # ⚠️ **单字**碎片的窗口（毫秒）：单字几乎总是一个词的一部分（你/睡/了/吗），
    #    值得多等；2~3 字的消息（「在吗」「好的」）常常是完整的一句，照旧只等 burstQuietMs
    burstQuietMs1: 5000
    burstGapMs: 2000
    burstMaxMs: 20000
    # ⚠️ 生成期间/刚结束攒到的碎片要等多久（毫秒）—— 比 burstQuietMs 长：
    #    那种处境是"他正打着字、而她在生成"，间隔天然更大（实测能到 5 秒）
    genHoldMs: 6000
status:
  enable: true
  host: mc.example.com
  displayName: 示例服务器 服务器
  cacheSeconds: 60
  keywords:
    - 在线
    - 几个人
